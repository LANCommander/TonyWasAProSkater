# Release builds: Windows and Linux, 64-bit only, from a version tag (v1.3.0).
#
# Pushing a tag vX.Y.Z[-suffix] builds two downloads and drafts the GitHub release.
# A -suffix marks a pre-release.
# Running the workflow manually builds the same downloads as artifacts only.
#
#   thps-windows-x64-X.Y.Z.zip
#   thps-linux-x64-X.Y.Z.tar.gz
#
# The build needs no retail files (game/retail_refs.tsv and game/psyq_names.tsv hold what it takes
# from SLUS_008.60); it does run Ghidra's GNU v2 demangler, which the demangler job fetches from
# the Ghidra release below.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, MAJOR.MINOR.PATCH[-suffix] (artifacts only)"
        required: false
        default: ""

permissions:
  contents: read

env:
  GHIDRA_VERSION: "12.0.3"
  GHIDRA_ZIP: ghidra_12.0.3_PUBLIC_20260210.zip
  GHIDRA_TAG: Ghidra_12.0.3_build

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v="${INPUT:-}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid version"
            exit 1
          fi

          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: ${v:-dev}"

  demangler:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: demangler
          key: ghidra-demangler-${{ env.GHIDRA_VERSION }}

      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/$GHIDRA_TAG/$GHIDRA_ZIP"

          mkdir -p demangler/linux_x86_64 demangler/win_x86_64

          unzip -j ghidra.zip \
            '*/GPL/DemanglerGnu/os/linux_x86_64/demangler_gnu_v2_24' \
            -d demangler/linux_x86_64

          unzip -j ghidra.zip \
            '*/GPL/DemanglerGnu/os/win_x86_64/demangler_gnu_v2_24.exe' \
            -d demangler/win_x86_64

          rm ghidra.zip

      - uses: actions/upload-artifact@v4
        with:
          name: demangler
          path: demangler
          retention-days: 1

  windows:
    needs: [version, demangler]
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: demangler
          path: ${{ runner.temp }}/demangler

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-SDL3

      - name: Build
        shell: pwsh
        env:
          THPS_ARCH: x64
          THPS_MINGW: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
          GNU_DEMANGLER: ${{ runner.temp }}\demangler\win_x86_64\demangler_gnu_v2_24.exe
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ver = if ($env:VERSION) { @("--version", $env:VERSION) } else { @() }

          python platform/pc/tools/build.py --release @ver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $out = "build/pc64/release"
          $suffix = if ($env:VERSION) { "-$env:VERSION" } else { "" }

          New-Item -ItemType Directory -Force dist | Out-Null

          Move-Item "$out/thps-windows$suffix.zip" "dist/thps-windows-x64$suffix.zip"
          Move-Item "$out/thps.debug" "dist/thps-windows-x64$suffix.debug"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: debug-windows-x64
          path: dist/*.debug

  linux:
    needs: [version, demangler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: demangler
          path: ${{ runner.temp }}/demangler

      - name: Build
        shell: bash
        env:
          THPS_ARCH: x64
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dem="$RUNNER_TEMP/demangler/linux_x86_64"
          chmod +x "$dem/demangler_gnu_v2_24"

          docker build -q -t thps-linux-build platform/pc/docker

          docker run --rm \
            -v "$PWD:/src" \
            -v "$dem:/demangler:ro" \
            -w /src \
            -u "$(id -u):$(id -g)" \
            -e GNU_DEMANGLER=/demangler/demangler_gnu_v2_24 \
            -e THPS_ARCH \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e THPS_COMMIT="$(git rev-parse --short=8 HEAD)" \
            -e VERSION \
            thps-linux-build \
            bash -c 'args=(--release); [ -n "$VERSION" ] && args+=(--version "$VERSION"); python3 platform/pc/tools/build.py "${args[@]}"'

          out=build/pc64-linux/release
          suffix="${VERSION:+-$VERSION}"

          mkdir -p dist

          mv "$out/thps-linux$suffix.tar.gz" \
            "dist/thps-linux-x64$suffix.tar.gz"

          mv "$out/thps.debug" \
            "dist/thps-linux-x64$suffix.debug"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: debug-linux-x64
          path: dist/*.debug

  release:
    needs: [version, windows, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--draft --verify-tag --title "$TAG" --notes "")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)

            gh release create "$TAG" "${flags[@]}" dist/*
          fi
